name: docs CD/CD 

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    environment:
      name: Production
    runs-on: ubuntu-26.04 
    steps:
    #Pulling the repo
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 #Only need latest commit
      
    #Sign into docker hub
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}
        
    #QEMU ig, going to have linux/amd64 and linux/arm64
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
        
    #Buidling the docker image
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
  
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        file: ./docs.Dockerfile
        push: true
        platforms: |
          linux/amd64
          linux/arm64
        tags: |
          munna00/file-sharing-server-docs:latest 
          munna00/file-sharing-server-docs:${{ github.sha }} 
          
  deploy:
    environment:
        name: Production
    needs: build
    runs-on: ubuntu-26.04  
    steps:
    - name: ssh into VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ vars.SERVER_IP }}
        username: ${{ vars.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          docker pull munna00/file-sharing-server-docs:latest
          docker stop file-sharing-docs-deployed || true
          docker rm -f file-sharing-docs-deployed || true
          docker run --name file-sharing-docs-deployed -d -p 80:80 munna00/file-sharing-server-docs:latest
